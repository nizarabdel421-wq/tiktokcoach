name: Build TikTokCoach.exe

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: pip install pyinstaller opencv-python-headless

      - name: Compiler en .exe
        run: pyinstaller --onefile --windowed --name TikTokCoach tiktok_coach.py

      - name: Publier le .exe
        uses: actions/upload-artifact@v4
        with:
          name: TikTokCoach-exe
          path: dist/TikTokCoach.exe
